<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIL RAG 챗봇</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1a1c22;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --bubble-user: #2563eb;
    --bubble-user-fg: #ffffff;
    --bubble-bot: #eef1f5;
    --bubble-bot-fg: #1a1c22;
    --source-bg: #eef2ff;
    --source-fg: #3730a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e37;
      --text: #e6e8ec;
      --muted: #9aa0ab;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --bubble-user: #3b82f6;
      --bubble-user-fg: #ffffff;
      --bubble-bot: #232733;
      --bubble-bot-fg: #e6e8ec;
      --source-bg: #1e2338;
      --source-fg: #a5b4fc;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #messages::-webkit-scrollbar {
    width: 8px;
  }

  #messages::-webkit-scrollbar-track {
    background: transparent;
  }

  #messages::-webkit-scrollbar-thumb {
    background-color: var(--border);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  #messages::-webkit-scrollbar-thumb:hover {
    background-color: var(--muted);
    background-clip: padding-box;
  }

  #messages:empty::before {
    content: "TIL에 대해 궁금한 걸 물어보세요.";
    color: var(--muted);
    font-size: 14px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }

  .msg.bot .bubble {
    background: var(--bubble-bot);
    color: var(--bubble-bot-fg);
    border-bottom-left-radius: 4px;
  }

  .msg.bot .bubble.error {
    background: #fee2e2;
    color: #991b1b;
  }

  .sources {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .source-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--source-bg);
    color: var(--source-fg);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  #question {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.5;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 120px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #question::-webkit-scrollbar {
    width: 6px;
  }

  #question::-webkit-scrollbar-track {
    background: transparent;
  }

  #question::-webkit-scrollbar-thumb {
    background-color: var(--border);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  #question::-webkit-scrollbar-thumb:hover {
    background-color: var(--muted);
    background-clip: padding-box;
  }

  #question:focus {
    outline: none;
    border-color: var(--accent);
  }

  button#send {
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button#send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>TIL RAG 챗봇</h1>
      <p>개인 학습 기록(TIL)을 근거로 답변합니다.</p>
    </header>

    <div id="messages"></div>

    <form id="chat-form">
      <textarea id="question" rows="1" placeholder="질문을 입력하세요..." autofocus></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </div>

<script>
  const form = document.getElementById('chat-form');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send');
  const messages = document.getElementById('messages');

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function addUserMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `<div class="bubble"></div>`;
    el.querySelector('.bubble').textContent = text;
    messages.appendChild(el);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.dataset.typing = 'true';
    el.innerHTML = `<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
    messages.appendChild(el);
    scrollToBottom();
    return el;
  }

  // answer 텍스트에서 [문서1], [문서2] 같은 패턴을 찾아 출처 태그로 뽑아낸다.
  function extractSources(text) {
    const matches = text.match(/\[문서\s*\d+\]/g) || [];
    const unique = [...new Set(matches.map(m => m.replace(/\s+/g, '')))];
    return unique;
  }

  function renderBotMessage(el, text, isError) {
    const bubble = el.querySelector('.bubble');
    bubble.classList.toggle('error', !!isError);
    bubble.textContent = text;

    if (!isError) {
      const sources = extractSources(text);
      if (sources.length > 0) {
        const sourcesEl = document.createElement('div');
        sourcesEl.className = 'sources';
        sourcesEl.innerHTML = sources
          .map(s => `<span class="source-tag">${s}</span>`)
          .join('');
        el.appendChild(sourcesEl);
      }
    }
    scrollToBottom();
  }

  async function sendQuestion(question) {
    addUserMessage(question);
    const typingEl = addTypingIndicator();

    sendBtn.disabled = true;
    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        throw new Error(`서버 오류 (${res.status})`);
      }

      const data = await res.json();
      renderBotMessage(typingEl, data.answer ?? '(빈 응답)', false);
    } catch (err) {
      renderBotMessage(typingEl, `오류가 발생했습니다: ${err.message}`, true);
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = '';
    input.style.height = 'auto';
    sendQuestion(question);
  });

  input.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
